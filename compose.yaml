services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./MovieVault.Api
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__MovieVault: "Data Source=mssql,1433;Database=MovieVault;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Serilog__WriteTo__0__Args__databaseUrl: "mongodb://mongo:27017/movievaultlogs"
      JWT__Issuer: "MovieVault"
      JWT__Audience: "MovieVault"
      JWT__SigningKey: ${JWT_SIGNING_KEY}
      Simulator__UserName: ${SIMULATOR_USERNAME}
      Simulator__Password: ${SIMULATOR_PASSWORD}
    depends_on:
      mssql:
        condition: service_healthy
      mongo:
        condition: service_healthy

  simulator:
    build: ./MovieVault.Simulator
    environment:
      Api__BaseUrl: "http://api:8080/"
      Simulator__UserName: ${SIMULATOR_USERNAME}
      Simulator__Password: ${SIMULATOR_PASSWORD}
    depends_on:
      - api

volumes:
  mssql-data:
  mongo-data:
